<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watashi 運用のお知らせ</title>
  <style>
    :root{font-family:system-ui,"Yu Gothic",sans-serif;color:#182b43;background:#f1f5f9;color-scheme:light}
    body{margin:0;padding:48px 20px}main{max-width:640px;margin:auto;background:#fff;border:1px solid #d4dee9;border-radius:16px;padding:32px;box-shadow:0 8px 28px #16334c0a}
    .brand{font-weight:700;color:#52667d;letter-spacing:.08em;font-size:14px}h1{font-size:28px;margin:12px 0 24px;line-height:1.4}
    .badge{display:inline-block;background:#e8eef6;padding:6px 12px;border-radius:20px;font-weight:700}.badge[data-state="maintenance"],.badge[data-state="recovering"]{background:#fff0cd;color:#704700}
    #message{font-size:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;min-height:3em}dl{border-top:1px solid #e3e9ef;padding-top:20px;line-height:1.8}dt{font-size:13px;color:#52667d}dd{margin:0 0 14px}
    button{border:0;border-radius:8px;background:#214e86;color:#fff;padding:12px 18px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #eca329;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}
    .note,#checked{font-size:13px;color:#52667d;line-height:1.7}#error{color:#914300;line-height:1.6}footer{max-width:640px;margin:20px auto;font-size:13px;color:#52667d;line-height:1.7}@media(max-width:480px){body{padding:20px 12px}main{padding:24px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main>
    <div class="brand">WATASHI</div>
    <h1>運用のお知らせ</h1>
    <section aria-live="polite" aria-atomic="true">
      <span id="state" class="badge">状態を確認しています</span>
      <p id="message">しばらくお待ちください。</p>
      <p id="error" hidden></p>
      <dl>
        <dt>開始予定</dt><dd id="start">—</dd>
        <dt>終了見込み</dt><dd id="end">—</dd>
        <dt>案内の更新日時</dt><dd id="updated">—</dd>
      </dl>
    </section>
    <button id="refresh" type="button">もう一度確認</button>
    <p id="checked">まだ確認できていません。</p>
    <p class="note">30秒ごとに確認します。終了見込みを過ぎても、復旧の案内までお待ちください。表示時刻はこの端末のタイムゾーンです。</p>
    <noscript><p>JavaScriptを有効にするか、管理者へ運用状態をご確認ください。</p></noscript>
  </main>
  <footer>このページは公開された運用案内です。サーバーやネットワークの稼働状況を保証するものではありません。通常運用の案内後も接続できない場合は、管理者へお問い合わせください。</footer>
  <script>
    'use strict';
    const labels={normal:'通常運用',scheduled:'メンテナンスの予告',maintenance:'メンテナンス中',recovering:'復旧確認中'};
    const defaults={normal:'通常運用の案内が公開されています。',scheduled:'メンテナンスを予定しています。',maintenance:'更新作業のため、リモート操作を一時停止しています。',recovering:'復旧を確認しています。利用再開の案内までお待ちください。'};
    const element=id=>document.getElementById(id);
    const format=value=>value?new Date(value).toLocaleString('ja-JP'):'—';
    let busy=false,revision=-1,checked=null;
    function validDate(value){return value===null||typeof value==='string'&&Number.isFinite(Date.parse(value));}
    async function refresh(){
      if(busy)return;
      busy=true;element('refresh').disabled=true;
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);
      try{
        const response=await fetch('./status.json',{cache:'no-store',credentials:'omit',redirect:'error',signal:controller.signal});
        if(!response.ok)throw new Error('response');
        const status=await response.json();
        if(!Object.hasOwn(labels,status.state)||!Number.isSafeInteger(status.revision)||status.revision<0||status.revision<revision||
           typeof status.message!=='string'||status.message.length>500||typeof status.updatedAtUtc!=='string'||!validDate(status.updatedAtUtc)||
           !validDate(status.startsAtUtc)||!validDate(status.expectedEndAtUtc))throw new Error('invalid status');
        revision=status.revision;checked=new Date();
        element('state').textContent=labels[status.state];element('state').dataset.state=status.state;
        element('message').textContent=status.message||defaults[status.state];
        element('start').textContent=format(status.startsAtUtc);element('end').textContent=format(status.expectedEndAtUtc);
        element('updated').textContent=format(status.updatedAtUtc);element('error').hidden=true;
        element('checked').textContent=`最終確認: ${checked.toLocaleString('ja-JP')}`;
      }catch{
        element('state').textContent='現在の状態を確認できません';element('state').dataset.state='unknown';
        element('error').textContent=checked?'以下の案内は前回確認時の内容です。現在の状態は不明です。しばらくして再確認してください。':'状態サイトに接続できないか、案内を読み取れません。しばらくして再確認してください。';
        element('error').hidden=false;
        if(!checked)element('message').textContent='運用状態は不明です。';
      }finally{clearTimeout(timer);busy=false;element('refresh').disabled=false;}
    }
    element('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,30000);
  </script>
</body>
</html>
