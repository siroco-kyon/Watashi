<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img"><title>ファイル操作の共通処理</title><rect width="1800" height="900" fill="white"/>
<text x="60" y="65" font-family="Yu Gothic, Meiryo, sans-serif" font-size="46" text-anchor="start" fill="#334155">ファイル操作の共通処理</text>
<rect x="60" y="160" width="480" height="200" rx="14" fill="#F5F7FA" stroke="#A8B6C5" stroke-width="2"/>
<text x="300.0" y="218" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" text-anchor="middle" fill="#17324D">1  認証</text>
<text x="300.0" y="275" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">JWT・利用者状態</text>
