<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">ファイル操作の共通処理</title>
  <desc id="desc">認証、パス解決、認可、経路選択、SMB実行、監査と応答の順序を示す。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748B"/></marker><style>.title{font:700 40px 'Yu Gothic',sans-serif;fill:#17324D}.step{font:700 27px 'Yu Gothic',sans-serif;fill:#17324D;text-anchor:middle}.sub{font:400 19px 'Yu Gothic',sans-serif;fill:#475569;text-anchor:middle}.note{font:400 22px 'Yu Gothic',sans-serif;fill:#475569}</style></defs>
  <text x="65" y="82" class="title">ファイル操作の共通処理</text>
  <g>
    <g><rect x="55" y="190" width="245" height="265" rx="22" fill="#EAF2F8" stroke="#2E74B5" stroke-width="4"/><text x="177.5" y="280" class="step">1. 認証</text><text x="177.5" y="340" class="sub">JWT・利用者状態</text></g>
    <g><rect x="350" y="190" width="245" height="265" rx="22" fill="#EAF2F8" stroke="#2E74B5" stroke-width="4"/><text x="472.5" y="280" class="step">2. パス解決</text><text x="472.5" y="340" class="sub">正規化・境界</text></g>
    <g><rect x="645" y="190" width="245" height="265" rx="22" fill="#EAF2F8" stroke="#2E74B5" stroke-width="4"/><text x="767.5" y="280" class="step">3. 認可</text><text x="767.5" y="340" class="sub">共有×サブパス×操作</text></g>
    <g><rect x="940" y="190" width="245" height="265" rx="22" fill="#E8F5F2" stroke="#2A8C82" stroke-width="4"/><text x="1062.5" y="280" class="step">4. 経路選択</text><text x="1062.5" y="340" class="sub">Direct / Agent</text></g>
    <g><rect x="1235" y="190" width="245" height="265" rx="22" fill="#E8F5F2" stroke="#2A8C82" stroke-width="4"/><text x="1357.5" y="280" class="step">5. 実行</text><text x="1357.5" y="340" class="sub">SMB操作</text></g>
    <g><rect x="1530" y="190" width="245" height="265" rx="22" fill="#E8F5F2" stroke="#2A8C82" stroke-width="4"/><text x="1652.5" y="280" class="step">6. 監査・応答</text><text x="1652.5" y="340" class="sub">成功・拒否・失敗</text></g>
    <g fill="none" stroke="#64748B" stroke-width="6" marker-end="url(#arrow)"><path d="M300 322 L345 322"/><path d="M595 322 L640 322"/><path d="M890 322 L935 322"/><path d="M1185 322 L1230 322"/><path d="M1480 322 L1525 322"/></g>
  </g>
  <text x="60" y="550" class="note">認可を経路選択より前に置き、DirectとAgentに共通の権限制御を適用する。監査記録は復旧経路を含めて一貫して扱う。</text>
</svg>