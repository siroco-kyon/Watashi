<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>Windows認証による初回パスワード設定</title><rect width="1800" height="1080" fill="white"/>
<text x="60" y="65" font-family="Yu Gothic, Meiryo, sans-serif" font-size="46" text-anchor="start" fill="#334155">Windows認証による初回パスワード設定</text>
<rect x="60" y="160" width="480" height="200" rx="14" fill="#F5F7FA" stroke="#A8B6C5" stroke-width="2"/>
<text x="300.0" y="218" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" text-anchor="middle" fill="#17324D">1  GID入力</text>
<text x="300.0" y="275" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">利用者が入力</text>
<rect x="660" y="160" width="480" height="200" rx="14" fill="#F5F7FA" stroke="#A8B6C5" stroke-width="2"/>
<text x="900.0" y="218" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" text-anchor="middle" fill="#17324D">2  Windows認証</text>
<text x="900.0" y="275" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">IIS / Negotiate</text>
<rect x="1260" y="160" width="480" height="200" rx="14" fill="#F5F7FA" stroke="#A8B6C5" stroke-width="2"/>
<text x="1500.0" y="218" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" text-anchor="middle" fill="#17324D">3  本人照合</text>
<text x="1500.0" y="275" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">ドメイン ＋ GID</text>
<rect x="1260" y="490" width="480" height="200" rx="14" fill="#F5F7FA" stroke="#A8B6C5" stroke-width="2"/>
<text x="1500.0" y="548" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" text-anchor="middle" fill="#17324D">4  状態確認</text>
<text x="1500.0" y="605" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">初回設定待ち</text>
<text x="1500.0" y="657" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">期限・ロック</text>
<rect x="660" y="490" width="480" height="200" rx="14" fill="#F5F7FA" stroke="#A8B6C5" stroke-width="2"/>
<text x="900.0" y="548" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" text-anchor="middle" fill="#17324D">5  本人が設定</text>
<text x="900.0" y="605" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">ポリシー確認</text>
<text x="900.0" y="657" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">トークン発行</text>
<path d="M540 260 L660 260" stroke="#64748B" stroke-width="3"/><polygon points="660,260 645.5928463623571,266.9594485457797 645.5928463623571,253.04055145422032" fill="#64748B"/>
