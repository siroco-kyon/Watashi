<path d="M1500 360 L1500 490" stroke="#64748B" stroke-width="3"/><polygon points="1500,490 1493.0405514542203,475.5928463623572 1506.9594485457797,475.5928463623572" fill="#64748B"/>
<path d="M1260 590 L1140 590" stroke="#64748B" stroke-width="3"/><polygon points="1140,590 1154.4071536376428,583.0405514542203 1154.4071536376428,596.9594485457797" fill="#64748B"/>
<path d="M1500 690 L1500 820" stroke="#64748B" stroke-width="3"/><polygon points="1500,820 1493.0405514542203,805.5928463623571 1506.9594485457797,805.5928463623571" fill="#64748B"/>
<rect x="60" y="820" width="1680" height="160" rx="14" fill="#EEF5F5" stroke="#A8B6C5" stroke-width="2"/>
<text x="900.0" y="878" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" text-anchor="middle" fill="#17324D">本人確認不可・Windows認証不可・条件不成立</text>
<text x="900.0" y="935" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="middle" fill="#334155">共通のパスワード入力へ戻る。必要時は管理者発行の一時パスワードを利用。</text>
<text x="60" y="1040" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" text-anchor="start" fill="#334155">不明なID・設定済みユーザーも同じ応答へそろえ、ユーザー列挙を抑える。</text>
</svg>